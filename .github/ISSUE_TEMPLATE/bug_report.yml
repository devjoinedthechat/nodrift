name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove secrets (RPC URLs with keys, private addresses you do not want to share) from anything you paste.
        Security issues: use the Security tab ("Report a vulnerability") instead of a public issue.
  - type: input
    id: version
    attributes:
      label: nodrift version
      description: Output of `nodrift --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.13, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal config
      description: The smallest config that reproduces the problem
      render: yaml
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Command you ran and its output (`--output json` is most useful)
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
