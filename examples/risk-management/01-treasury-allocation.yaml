# Treasury Allocation Monitoring
# This example demonstrates monitoring a DAO treasury's asset allocation
# Using Uniswap Treasury as an example

version: 1.0

network:
  rpc_url: "${RPC_URL}"
  chain_id: 1

contracts:
  # Monitor UNI token holdings in treasury
  UNI_Treasury_Holdings:
    address: "0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984"  # UNI token
    abi:
      - name: balanceOf
        type: function
        stateMutability: view
        inputs:
          - type: address
        outputs:
          - type: uint256
      - name: totalSupply
        type: function
        stateMutability: view
        inputs: []
        outputs:
          - type: uint256
    
    state:
      # Check treasury UNI balance
      - type: function_call
        function: balanceOf
        args: ["0x1a9C8182C09F50C8318d769245beA52c32BE35BC"]  # Uniswap Treasury
        value: "100000000000000000000000000"  # At least 100M UNI
        options:
          comparison: greater_than
      
      # Snapshot of the treasury balance (about 262M UNI in October 2026).
      # Governance grants move it; drift here means UNI left or entered the treasury.
      - type: function_call
        function: balanceOf
        args: ["0x1a9C8182C09F50C8318d769245beA52c32BE35BC"]
        value: "262000000000000000000000000"  # ~262M UNI
        options:
          tolerance: "10%"
  
  # Monitor USDC holdings (stablecoin reserves)
  USDC_Treasury_Holdings:
    address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"  # USDC
    abi:
      - name: balanceOf
        type: function
        stateMutability: view
        inputs:
          - type: address
        outputs:
          - type: uint256
    
    state:
      # Check treasury has USDC reserves
      - type: function_call
        function: balanceOf
        args: ["0x1a9C8182C09F50C8318d769245beA52c32BE35BC"]
        value: "1000000"  # At least 1 USDC (treasury may have minimal stables)
        options:
          comparison: greater_than
  
  # Monitor WETH holdings (ETH exposure)
  WETH_Treasury_Holdings:
    address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"  # WETH
    abi:
      - name: balanceOf
        type: function
        stateMutability: view
        inputs:
          - type: address
        outputs:
          - type: uint256
    
    state:
      # The treasury held no WETH when this example was written; any balance is worth a look
      - type: function_call
        function: balanceOf
        args: ["0x1a9C8182C09F50C8318d769245beA52c32BE35BC"]
        value: 0
  
  # Monitor DAI holdings (stablecoin diversification)
  DAI_Treasury_Holdings:
    address: "0x6B175474E89094C44Da98b954EedeAC495271d0F"  # DAI
    abi:
      - name: balanceOf
        type: function
        stateMutability: view
        inputs:
          - type: address
        outputs:
          - type: uint256
    
    state:
      # The treasury held no DAI when this example was written; any balance is worth a look
      - type: function_call
        function: balanceOf
        args: ["0x1a9C8182C09F50C8318d769245beA52c32BE35BC"]
        value: 0
